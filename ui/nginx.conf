# Serves the static export (ui/out). Pages are files like kb.html, so /kb -> kb.html.
# The API is not proxied here: on AWS the load balancer sends /api/* to the brain and everything else here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    location = /ui-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: safe to cache for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        # The console uses the microphone (live call); nothing else.
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
