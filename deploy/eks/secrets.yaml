# Secrets Manager -> the brain's environment, through the Secrets Store CSI Driver (AWS provider).
# The secret "au/brain" is one JSON object: {"DATABASE_URL": "...", "SARVAM_API_KEY": "...", "RECORDING_KEY": "..."}.
# The driver must run with secret sync on (Helm value syncSecret.enabled=true): it then keeps the Kubernetes Secret
# au-brain-env, which brain.yaml reads as environment variables. The pod's IAM role (Pod Identity) needs
# secretsmanager:GetSecretValue on au/brain.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: au-brain-secrets
  namespace: au-voice
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "au/brain"
        objectType: "secretsmanager"
        jmesPath:
          - {path: DATABASE_URL, objectAlias: DATABASE_URL}
          - {path: SARVAM_API_KEY, objectAlias: SARVAM_API_KEY}
          - {path: RECORDING_KEY, objectAlias: RECORDING_KEY}
  secretObjects:
    - secretName: au-brain-env
      type: Opaque
      data:
        - {objectName: DATABASE_URL, key: DATABASE_URL}
        - {objectName: SARVAM_API_KEY, key: SARVAM_API_KEY}
        - {objectName: RECORDING_KEY, key: RECORDING_KEY}
