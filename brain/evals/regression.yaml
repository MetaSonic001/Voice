# ══ Targeted checks from the PM's 17 Nov test list (card consent, loans and EMIs, transactions, context), several cases
# merged per call. Ravi (101): debit 3390 (Value 4521) and 7781 (Digital 4512, inactive), credit 6712 and 2208; home loan
# 0101 and personal loan 0102 (last EMI returned). Pooja (106): UPI out and in. Sunita (107): one gold loan.

