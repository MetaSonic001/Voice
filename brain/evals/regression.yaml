# ── Stage 2: fraud and actions ──
- {id: R06-stolen-already-blocked, cls: fraud, caller: "9000000105", turns: [
    {say: "I've lost my credit card. I think someone stole it. I need to block it immediately.", outcome: [confirm, answered, auth_required, handoff], lacks: ["nothing to change"]},
    {say: "Does that mean everything is safe now?", outcome: [answered, confirm, clarify, handoff], lacks: ["everything is safe", "nothing to worry"]},
    {say: "Yes, please connect me.", outcome: [handoff, action_done]},  # the card may be active (block confirmed) or already blocked
    {say: "Do I need to explain everything again?", outcome: [answered, smalltalk, handoff, clarify, confirm], has_any: ["repeat"]}]}
- {id: R07-unrecognised-generic, cls: fraud, caller: "9000000101", turns: [
    {say: "I don't recognise a payment from my account.", outcome: [clarify, confirm], lacks: ["your account is safe"]},
    {say: "I'm not sure. Maybe sometime last week.", outcome: [clarify, answered, confirm]},
    {say: "So my account is safe?", outcome: [answered, clarify, confirm, refused], lacks: ["your account is safe", "yes, it is safe"]},
    {say: "Yes, connect me.", outcome: [handoff]}]}
