    {say: "I want to block my card.", outcome: [clarify], has: ["temporarily", "permanently"]},
    {say: "Temporarily. The credit card ending 6712.", outcome: [confirm], has: ["temporarily", "6712"], lacks: ["permanently block"]},
    {say: "Actually, make it permanent.", outcome: [confirm], has: ["permanently", "6712"]},
    {say: "Will I get a replacement card?", outcome: [answered, confirm, clarify], lacks: ["is now permanently blocked"]},
    {say: "No.", outcome: [cancelled], lacks: ["is now"]}]}
- {id: A2-yes-block-and-connect, cls: action, caller: "9000000101", turns: [
    {say: "Permanently block my credit card ending 2208.", outcome: [confirm], has: ["permanently", "2208"]},
    {say: "Yes, block it and connect me to someone.", outcome: [handoff, action_done], has: ["blocked"]}]}
- {id: A3-no-but-connect, cls: action, caller: "9000000101", turns: [
    {say: "Temporarily block my debit card ending 3390.", outcome: [confirm], has: ["3390"]},
    {say: "No, don't block it, but connect me to the card team.", outcome: [handoff], lacks: ["is now", "blocked."]}]}
- {id: A4-lost-dont-block-yet, cls: fraud, caller: "9000000101", turns: [
