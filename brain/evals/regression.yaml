    {say: "How much can I actually use right now?", outcome: [answered], has: ["79,850"]},
    {say: "So has that 2,500 already been deducted?", outcome: [answered, clarify], has_any: ["hold", "pending"], lacks: ["was deducted", "has been deducted"]}]}
