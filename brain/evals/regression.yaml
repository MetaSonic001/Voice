    {say: "क्या मेरे पैसे निकल गए हैं?", outcome: [answered, confirm, clarify, handoff], lacks: ["अच्छी बात"]},
    {say: "ठीक है, connect कर दीजिए।", outcome: [handoff]}]}
- {id: R10-temp-block, cls: action, caller: "9000000101", turns: [
