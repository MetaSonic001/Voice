# Regression pack from the PM's review of the 16 Nov live calls (17 Nov). Whole conversations on the real LLM, typed (the
# same brain as a voice call: understanding, bank, templates, speech text), replay-cached like the smoke set.
#   python -m evals.smoke --pack regression --keep [--only id ...]      (--keep leaves the calls on /calls for review)
# Keys per turn as in smoke.yaml. The checks catch the failures seen in the calls; the transcripts in the report are read
# in full as well. Demo customers: 101 Ravi (4512 Digital, 4521 Value with a ₹2,500 hold; home + personal loan; credit
# card 6712; ₹10,000 UPI to Suresh Patel, processing), 105 Imran (Ananta 4410, permanently blocked), 106 Pooja (salary,
# Rajesh ₹5,000 today, 4 UPI payments this week), 107 Sunita (gold loan, Hindi).
# Not here: voice turn-taking (conversation 12: tests/test_voice_session.py), a bank system down (tests), credit-card
# discovery (conversation 15: a product decision is open).

# ── Stage 1: financial data and intent ──
- {id: R01-balance-hold, cls: balance, caller: "9000000101", turns: [
