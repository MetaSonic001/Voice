[project]
name = "au-brain"
version = "0.1.0"
description = "AU SFB voice agent - knowledge service (Phase A: general Q&A, text)"
requires-python = ">=3.12"  # Docker / AWS run 3.12 (exact versions: requirements.txt); the office laptop runs 3.14
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    "torch>=2.5",  # install the CPU or CUDA build first (requirements.txt header)
    "pdfplumber>=0.11",
    "edge-tts>=7.3.1",
    "silero-vad>=6.2.3",
    "av>=19.0.2",
    "boto3>=1.43.123",
    "transformers>=4.50",
    "openpyxl>=3.1",
    "numpy>=2.0",
    "psutil>=6.0",
    "websockets>=13",
    "cryptography>=44",  # recordings encrypted at rest (AES-256-GCM); PyCA, already installed with pdfplumber
    "onnxruntime>=1.20",  # SEARCH_RUNTIME=onnx: the search models on a CPU (Microsoft ONNX Runtime; ADR 0029)
    "truststore>=0.10",  # USE_SYSTEM_CERTS=true: HTTPS trusts the OS certificate store (pure Python, no DLL; used by pip)
]

[project.scripts]
brain = "app.cli:main"

[project.optional-dependencies]
# pip install -e ".[dev]": tests. pgserver = the tests' throwaway Postgres when TEST_DATABASE_URL is not set (no 3.14 build).
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pgserver>=0.1.4; python_version < '3.14'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
