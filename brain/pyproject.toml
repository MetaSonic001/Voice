[project]
name = "au-brain"
version = "0.1.0"
description = "AU SFB voice agent - knowledge service (Phase A: general Q&A, text)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "pgserver>=0.1.4",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    "torch>=2.5",
    "pdfplumber>=0.11",
    "edge-tts>=7.3.1",
    "silero-vad>=6.2.3",
    "av>=19.0.2",
    "boto3>=1.43.123",
    "transformers>=4.50",
    "openpyxl>=3.1",
    "numpy>=2.0",
    "psutil>=6.0",
    "websockets>=13",
    "cryptography>=44",  # recordings encrypted at rest (AES-256-GCM); PyCA, already installed with pdfplumber
]

[project.scripts]
brain = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: calls the real Groq API and local models (slow, needs GROQ_API_KEY)"]
